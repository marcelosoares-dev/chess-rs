version: '3.8'

services:
  backend:
    build: ./backend
    container_name: chess_backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - cargo_cache:/usr/local/cargo/registry
    environment:
      - RUST_LOG=debug

  frontend:
    build: ./frontend
    container_name: chess_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true

volumes:
  cargo_cache:

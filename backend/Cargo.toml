[package]
name = "chess-backend"
version = "1.0.0"
authors = ["Marcelo Soares <https://www.linkedin.com/in/marcelosoares-dev/>"]
description = "Motor de xadrez multiplayer e servidor websocket escrito em Rust"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "chess_backend"
path = "src/lib.rs"

[[bin]]
name = "chess-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shakmaty = "0.26"
thiserror = "1"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.24"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "chess-backend"
version = "1.0.0"
authors = ["Marcelo Soares <https://www.linkedin.com/in/marcelosoares-dev/>"]
description = "Motor de xadrez multiplayer e servidor websocket escrito em Rust"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.35", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
shakmaty = "0.26"
futures-util = "0.3"
